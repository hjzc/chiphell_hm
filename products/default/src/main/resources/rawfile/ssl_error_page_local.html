<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SSL 证书错误 - 无法安全连接</title>

    <!-- 内置 Tailwind 核心样式（精简版，仅保留必要功能） -->
    <style>
        /* 基础重置 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif; }
        button { cursor: pointer; border: none; outline: none; }

        /* 颜色变量（与原配置一致） */
        :root {
          --primary: #ef4444;
          --primary-light: #fef2f2;
          --primary-opacity-20: rgba(239, 68, 68, 0.2);
          --secondary: #4b5563;
          --neutral: #f9fafb;
          --dark: #1f2937;
          --gray-100: #f3f4f6;
          --gray-200: #e5e7eb;
          --gray-300: #d1d5db;
          --gray-500: #6b7280;
          --yellow-50: #fefce8;
          --yellow-400: #facc15;
          --yellow-500: #eab308;
          --yellow-800: #78350f;
          --red-600: #dc2626;
          --red-700: #b91c1c;
        }

        /* 布局工具类 */
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .sm:flex-row { @media (min-width: 640px) { flex-direction: row; } }
        .items-center { align-items: center; }
        .items-start { align-items: flex-start; }
        .justify-center { justify-content: center; }
        .justify-between { justify-content: space-between; }
        .flex-1 { flex: 1; }
        .min-h-screen { min-height: 100vh; }
        .w-full { width: 100%; }
        .max-w-md { max-width: 28rem; }
        .fixed { position: fixed; }
        .absolute { position: absolute; }
        .inset-0 { top: 0; left: 0; right: 0; bottom: 0; }
        .top-4 { top: 1rem; }
        .left-4 { left: 1rem; }
        .hidden { display: none; }
        .opacity-0 { opacity: 0; }
        .opacity-100 { opacity: 1; }
        .overflow-hidden { overflow: hidden; }
        .overflow-x-auto { overflow-x: auto; }

        /* 间距工具类 */
        .p-4 { padding: 1rem; }
        .p-5 { padding: 1.25rem; }
        .p-6 { padding: 1.5rem; }
        .p-8 { padding: 2rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
        .m-0 { margin: 0; }
        .mt-3 { margin-top: 0.75rem; }
        .mt-4 { margin-top: 1rem; }
        .mt-6 { margin-top: 1.5rem; }
        .mb-3 { margin-bottom: 0.75rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .mr-1 { margin-right: 0.25rem; }
        .mr-2 { margin-right: 0.5rem; }
        .mr-3 { margin-right: 0.75rem; }
        .gap-3 { gap: 0.75rem; }

        /* 样式工具类 */
        .bg-white { background-color: white; }
        .bg-neutral { background-color: var(--neutral); }
        .bg-primary-light { background-color: var(--primary-light); }
        .bg-primary-opacity-20 { background-color: var(--primary-opacity-20); }
        .bg-gray-100 { background-color: var(--gray-100); }
        .bg-yellow-50 { background-color: var(--yellow-50); }
        .bg-primary { background-color: var(--primary); }
        .bg-red-600 { background-color: var(--red-600); }
        .bg-black-50 { background-color: rgba(0, 0, 0, 0.5); }

        .text-dark { color: var(--dark); }
        .text-secondary { color: var(--secondary); }
        .text-primary { color: var(--primary); }
        .text-white { color: white; }
        .text-gray-500 { color: var(--gray-500); }
        .text-gray-600 { color: var(--gray-500); }
        .text-gray-700 { color: #374151; }
        .text-yellow-500 { color: var(--yellow-500); }
        .text-yellow-800 { color: var(--yellow-800); }

        .font-bold { font-weight: 600; }
        .font-medium { font-weight: 500; }
        .font-mono { font-family: monospace; }
        .text-center { text-align: center; }
        .text-sm { font-size: 0.875rem; }
        .text-lg { font-size: 1.125rem; }
        .text-xl { font-size: 1.25rem; }
        .text-[clamp(1.5rem,3vw,2rem)] { font-size: clamp(1.5rem, 3vw, 2rem); }

        .rounded-2xl { border-radius: 1rem; }
        .rounded-xl { border-radius: 0.75rem; }
        .rounded-lg { border-radius: 0.5rem; }
        .rounded-r-lg { border-radius: 0 0.5rem 0.5rem 0; }
        .rounded-full { border-radius: 9999px; }

        .border { border: 1px solid; }
        .border-gray-200 { border-color: var(--gray-200); }
        .border-gray-300 { border-color: var(--gray-300); }
        .border-l-4 { border-left-width: 4px; }
        .border-yellow-400 { border-color: var(--yellow-400); }

        .shadow-xl { box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); }
        .shadow-2xl { box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); }
        .shadow-md { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
        .shadow-lg { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); }

        .backdrop-blur-sm { backdrop-filter: blur(4px); }
        .hover\:bg-gray-50:hover { background-color: #f9fafb; }
        .hover\:bg-primary\/90:hover { background-color: rgba(239, 68, 68, 0.9); }
        .hover\:bg-red-700:hover { background-color: var(--red-700); }
        .hover\:shadow-lg:hover { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); }
        .hover\:shadow-2xl:hover { box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); }
        .hover\:underline:hover { text-decoration: underline; }
        .hover\:text-gray-600:hover { color: #4b5563; }

        /* 动画与过渡 */
        .transition-all-300 { transition: all 0.3s ease; }
        .transform { transform: translateZ(0); }
        .scale-95 { transform: scale(0.95); }
        .scale-100 { transform: scale(1); }

        /* 自定义动画 */
        @keyframes pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.7; }
        }
        .pulse-animation { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

        /* 图标样式（Font Awesome 精简版，仅保留用到的图标） */
        .fa { display: inline-block; width: 1em; height: 1em; line-height: 1; font-family: "FontAwesome"; font-weight: normal; font-style: normal; text-decoration: inherit; text-align: center; vertical-align: middle; }
        .fa-arrow-left:before { content: "\f060"; }
        .fa-lock:before { content: "\f023"; }
        .fa-exclamation-circle:before { content: "\f06a"; }
        .fa-check-circle:before { content: "\f058"; }
        .fa-info-circle:before { content: "\f05a"; }
        .fa-times:before { content: "\f00d"; }
        .fa-shield:before { content: "\f132"; }
        .fa-cog:before { content: "\f013"; }
    </style>
</head>
<body class="bg-neutral min-h-screen flex flex-col items-center justify-center p-4 md:p-8 text-dark">
<!-- 顶部返回按钮（移动端） -->
<button id="backBtn" class="absolute top-4 left-4 md:hidden bg-white/80 backdrop-blur-sm p-2 rounded-full shadow-md hover:shadow-lg transition-all-300">
    <i class="fa fa-arrow-left text-secondary"></i>
</button>

<div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden transform transition-all duration-500 hover:shadow-2xl">
    <!-- 错误图标区域 -->
    <div class="bg-primary-light p-8 flex justify-center">
        <div class="w-24 h-24 bg-primary-opacity-20 rounded-full flex items-center justify-center pulse-animation">
            <i class="fa fa-lock text-primary text-5xl"></i>
        </div>
    </div>

    <!-- 内容区域 -->
    <div class="p-6 md:p-8">
        <h1 class="text-[clamp(1.5rem,3vw,2rem)] font-bold text-dark mb-3 text-center">SSL 证书错误</h1>
        <p class="text-secondary text-center mb-6" id="errorDesc">无法安全连接到目标服务器</p>

        <!-- 错误详情卡片 -->
        <div class="bg-neutral rounded-xl p-5 mb-6 border border-gray-200">
            <h2 class="font-semibold text-lg mb-3 flex items-center">
                <i class="fa fa-exclamation-circle text-primary mr-2"></i>
                可能的原因
            </h2>
            <ul class="space-y-2 text-secondary text-sm" id="errorReasons">
                <li id="sslErro_0" class="flex items-start" >
                    <i class="fa fa-check-circle text-primary mt-1 mr-2"></i>
                    <span>网站证书已过期或未生效</span>
                </li>
                <li id="sslErro_1" class="flex items-start">
                    <i class="fa fa-check-circle text-primary mt-1 mr-2"></i>
                    <span>证书与网站域名不匹配</span>
                </li>
                <li id="sslErro_2" class="flex items-start">
                    <i class="fa fa-check-circle text-primary mt-1 mr-2"></i>
                    <span>证书未被信任的机构颁发</span>
                </li>
                <li id="sslErro_3" class="flex items-start">
                    <i class="fa fa-check-circle text-primary mt-1 mr-2"></i>
                    <span>网络连接可能被拦截或篡改</span>
                </li>
            </ul>
        </div>

        <!-- 安全提示 -->
        <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-6 rounded-r-lg">
            <div class="flex items-start">
                <i class="fa fa-info-circle text-yellow-500 mt-1 mr-3 text-xl"></i>
                <p class="text-sm text-yellow-800">
                    <strong>安全警告：</strong>继续访问可能会导致您的个人信息被窃取。建议仅在信任该网站的情况下继续。
                </p>
            </div>
        </div>

        <!-- 操作按钮 -->
        <div class="flex flex-col sm:flex-row gap-3">
            <button id="backBtn1" class="flex-1 bg-white border border-gray-300 rounded-lg py-3 px-4 font-medium text-secondary hover:bg-gray-50 transition-all-300 flex items-center justify-center">
                <i class="fa fa-times mr-2"></i> 返回
            </button>
            <button id="cancelBtn" class="flex-1 bg-white border border-gray-300 rounded-lg py-3 px-4 font-medium text-secondary hover:bg-gray-50 transition-all-300 flex items-center justify-center">
                <i class="fa fa-times mr-2"></i> 取消访问
            </button>
            <button id="continueBtn" class="flex-1 bg-primary text-white rounded-lg py-3 px-4 font-medium hover:bg-primary/90 transition-all-300 flex items-center justify-center">
                <i class="fa fa-shield mr-2"></i> 继续访问（不推荐）
            </button>
        </div>

        <!-- 高级选项 -->
<!--        <div class="mt-4 text-center">-->
<!--            <button id="advancedBtn" class="text-primary text-sm hover:underline transition-all-300 flex items-center justify-center">-->
<!--                <i class="fa fa-cog mr-1"></i> 高级选项-->
<!--            </button>-->
<!--        </div>-->
    </div>
</div>

<!-- 页脚信息 -->
<div class="mt-6 text-center text-sm text-gray-500">
    <p id="errorCode">WebView 安全连接 | 错误代码: SSL_ERROR_CODE_STRING</p>
</div>

<!-- 高级选项模态框 -->
<div id="advancedModal" class="fixed inset-0 bg-black-50 backdrop-blur-sm flex items-center justify-center p-4 hidden opacity-0 transition-all-300">
    <div class="bg-white rounded-xl shadow-2xl max-w-md w-full transform scale-95 transition-all-300">
        <div class="p-6 border border-gray-200">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-lg">高级选项</h3>
                <button id="closeModalBtn" class="text-gray-500 hover:text-gray-600">
                    <i class="fa fa-times text-xl"></i>
                </button>
            </div>
        </div>
        <div class="p-6">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">网站地址</label>
                <div class="bg-gray-100 rounded-lg p-3 text-sm text-gray-600 font-mono overflow-x-auto" id="siteUrl">
                    SSL_ERROR_URL
                </div>
            </div>
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">证书信息</label>
                <ul class="space-y-2 text-sm text-gray-600" id="certInfo">
                    <li>颁发者: 未知机构</li>
                    <li>有效期: 已过期</li>
                    <li>指纹: SHA256: XXXXXX...</li>
                </ul>
            </div>
            <button id="bypassBtn" class="w-full bg-red-600 text-white rounded-lg py-3 font-medium hover:bg-red-700 transition-all-300">
                强制绕过 SSL 验证（风险极高）
            </button>
        </div>
    </div>
</div>

<script>
    window.SSL_ERROR_CONFIG = window.SSL_ERROR_CONFIG || {
      errorCodeValue:SSL_ERROR_CODE_VALUE,
      errorCode: "SSL_ERROR_CODE_STRING",
      errorDesc: "SSL_ERROR_CODE_DESC",
      siteUrl: "SSL_ERROR_URL",
      certIssuer: "未知机构",
      certValidity: "已过期",
      certFingerprint: "SHA256: XXXXXX...",
      // 原生回调函数（由 WebView 注入实现）
      onBack: function() { /* alert("返回上一页");*/ try{  window.JsBridge.sslBack(); }catch(e){} },
      onCancel: function() { /*alert("已取消访问");*/ try{  window.JsBridge.sslCancel(); }catch(e){}},
      onContinue: function() { /*alert("正在尝试继续访问...\n注意：此连接不安全");*/  try{  window.JsBridge.sslContinue();}catch(e){} },
      onBypass: function() { alert("已强制绕过SSL验证\n警告：这会使您的设备面临安全风险"); try{   window.JsBridge.sslBypass();}catch(e){}}
    };

    document.addEventListener('DOMContentLoaded', function() {
      const backBtn = document.getElementById('backBtn');
      const backBtn1 = document.getElementById('backBtn1');
      const cancelBtn = document.getElementById('cancelBtn');
      const continueBtn = document.getElementById('continueBtn');
      const advancedBtn = document.getElementById('advancedBtn');
      const advancedModal = document.getElementById('advancedModal');
      const closeModalBtn = document.getElementById('closeModalBtn');
      const bypassBtn = document.getElementById('bypassBtn');

      document.getElementById('errorCode').textContent = `WebView 安全连接 | 错误代码: ${window.SSL_ERROR_CONFIG.errorCode}`;
      document.getElementById('errorDesc').textContent = window.SSL_ERROR_CONFIG.errorDesc;
      document.getElementById('siteUrl').textContent = window.SSL_ERROR_CONFIG.siteUrl;

      const certInfoEl = document.getElementById('certInfo');
      certInfoEl.innerHTML = `
        <li>颁发者: ${window.SSL_ERROR_CONFIG.certIssuer}</li>
        <li>有效期: ${window.SSL_ERROR_CONFIG.certValidity}</li>
        <li>指纹: ${window.SSL_ERROR_CONFIG.certFingerprint}</li>
      `;

      function toggleModal(show) {
        if (show) {
          advancedModal.classList.remove('hidden');
          setTimeout(() => {
            advancedModal.classList.add('opacity-100');
            advancedModal.querySelector('div').classList.remove('scale-95');
            advancedModal.querySelector('div').classList.add('scale-100');
          }, 10);
        } else {
          advancedModal.classList.remove('opacity-100');
          advancedModal.querySelector('div').classList.remove('scale-100');
          advancedModal.querySelector('div').classList.add('scale-95');
          setTimeout(() => {
            advancedModal.classList.add('hidden');
          }, 300);
        }
      }

      backBtn.addEventListener('click', window.SSL_ERROR_CONFIG.onBack);
      backBtn1.addEventListener('click', window.SSL_ERROR_CONFIG.onBack);
      cancelBtn.addEventListener('click', window.SSL_ERROR_CONFIG.onCancel);
      continueBtn.addEventListener('click', window.SSL_ERROR_CONFIG.onContinue);
      advancedBtn.addEventListener('click', () => toggleModal(true));
      closeModalBtn.addEventListener('click', () => toggleModal(false));
      bypassBtn.addEventListener('click', function() {
        window.SSL_ERROR_CONFIG.onBypass();
        toggleModal(false);
      });

      advancedModal.addEventListener('click', (e) => {
        if (e.target === advancedModal) {
          toggleModal(false);
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !advancedModal.classList.contains('hidden')) {
          toggleModal(false);
        }
      });


    });
</script>
</body>
</html>
